---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: renovate
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: renovate-secret
    template:
      data:
        APP_ID: "{{ .GITHUB_BOT_APP_CLIENT_ID }}"
        INSTALL_ID: "{{ .GITHUB_BOT_APP_INSTALLATION_ID }}"
        # The 1Password field holds the key on one line, with spaces where the line breaks were
        PEM: '{{ .GITHUB_BOT_APP_PRIVATE_KEY | replace " " "\n" | replace "-----BEGIN\nRSA\nPRIVATE\nKEY-----" "-----BEGIN RSA PRIVATE KEY-----" | replace "-----END\nRSA\nPRIVATE\nKEY-----" "-----END RSA PRIVATE KEY-----" }}'
  dataFrom:
    - extract:
        key: wall-e-ri3d-bot